name: Test basic usage - invalid API key fails with auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      # Provide a dummy API key; the action should fail with an auth/API error,
      # not a configuration or entrypoint error.
      GITGUARDIAN_API_KEY: dummy-invalid-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ggshield action (expected to fail with auth error)
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed due to auth/scan error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid API key), not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid API key, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed (expected with dummy API key)"
