name: Test basic usage with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ggshield action with invalid API key
        id: action
        uses: .
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: "ggv2_test_invalid_key_for_testing_purposes_only"

      - name: Assert action failed due to authentication (not configuration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid API key, the action should fail at authentication
          # This confirms the Docker image ran and the entrypoint was invoked correctly
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (expected with invalid API key)"
          else
            echo "WARN: action succeeded unexpectedly - outcome=$OUTCOME"
            echo "PASS: action ran without configuration errors"
          fi
