name: Test basic usage - invalid API key produces auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action is expected to fail because the API key is invalid.
    # We use continue-on-error to capture the failure and assert on it.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: fake-api-key-for-testing
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action failed (expected with invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
