name: Test action with help args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with --help flag
        id: action
        uses: .
        continue-on-error: true
        with:
          args: "--help"
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
          # No GITGUARDIAN_API_KEY needed for --help
      - name: Assert action ran (help flag may exit non-zero in CI mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (exit 0 with help text) or fail
          # (because CI mode requires an API key even for --help).
          # Either way, the Docker container must have started and run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
