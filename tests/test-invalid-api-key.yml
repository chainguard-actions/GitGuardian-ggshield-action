name: Test invalid API key error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: "invalid-fake-api-key-for-testing"
      - name: Assert action failed with invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
