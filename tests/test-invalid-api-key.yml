name: Test invalid API key error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ggshield action with invalid API key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: fake-invalid-api-key-for-testing

      - name: Assert action failed due to invalid API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when GITGUARDIAN_API_KEY is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is invalid"
