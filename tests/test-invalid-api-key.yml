name: Test ggshield action fails with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITGUARDIAN_API_KEY: dummy-invalid-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # GITGUARDIAN_API_KEY is set but invalid — action should fail with API/auth error

      - name: Assert action failed with invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid GITGUARDIAN_API_KEY, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API key"
