name: Test missing API key error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ggshield action without API key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # No GITGUARDIAN_API_KEY set — action should fail

      - name: Assert action failed due to missing API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when GITGUARDIAN_API_KEY is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is missing"
