name: Test no API key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without API key and capture exit code
        id: action
        uses: .
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: ""

      - name: Assert action failed without API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without API key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without API key"
