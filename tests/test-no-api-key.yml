name: Test ggshield action fails without API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # No GITGUARDIAN_API_KEY set — action should fail with auth error

      - name: Assert action failed without API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GITGUARDIAN_API_KEY, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without API key"
