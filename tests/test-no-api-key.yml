name: Test ggshield action without API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        # No GITGUARDIAN_API_KEY set — action should fail with auth/config error

      - name: Assert action failed gracefully without API key
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without GITGUARDIAN_API_KEY"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without an API key"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
