name: Test ggshield - with args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ggshield action with args and no API key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          args: "--verbose"
        env:
          GITGUARDIAN_API_KEY: ""

      - name: Assert action failed (no valid API key provided)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no API key is provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided (args input accepted)"
