name: Test with-args - ggshield action passes args to secret scan ci
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ggshield action with --help arg
        id: action
        uses: .
        continue-on-error: true
        with:
          args: "--help"
        env:
          GITGUARDIAN_API_KEY: ""
      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with args (outcome=$OUTCOME)"
